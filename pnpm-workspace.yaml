allowBuilds:
  sharp: false
  unrs-resolver: false
  # esbuild resolves its platform binary from optional @esbuild/* packages; its
  # install script is a fallback we do not need (works without it — verified).
  esbuild: false
  # embedded-postgres ships PostgreSQL binaries whose required symlinks cannot
  # be represented in npm tarballs; its postinstall hydrates them. Without this
  # approval the DB test harness cannot boot (see ARCHITECTURE.md).
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-ia32": true
  "@embedded-postgres/linux-ppc64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
